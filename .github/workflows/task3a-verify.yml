name: Task 3A verification
permissions:
  contents: write
on:
  push:
    branches:
      - task-3a-solution
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out solution branch
        uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Run official host test suite
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          gcc --version
          bash test.sh
      - name: Audit all paths and all supplied PRESENT vectors
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          cat > /tmp/task3a_audit.c <<'EOF'
          #define main task3a_program_main
          #include "Path_Planner_Dec.c"
          #undef main
          #include <stdio.h>

          int main(void) {
              uint16_t ref[36][36];
              uint8_t path[40], dist[36];
              uint32_t hi, lo;
              unsigned edges = 0, pairs = 0;
              unsigned i, j, k, z;
              struct vector { uint32_t ch, cl, ph, pl; };
              static const struct vector cases[6] = {
                  {0xE3399C2Au,0xAF0E5CA0u,0x0048454Cu,0x4C4F0C1Au},
                  {0x21020660u,0x468109D7u,0x00474F00u,0x00002421u},
                  {0xD30E1799u,0xF911813Au,0x00000000u,0x00000316u},
                  {0x988CEBC3u,0x55E41A9Du,0x00574156u,0x59000324u},
                  {0xD01C53F5u,0xBFD076BAu,0x01425945u,0x00000011u},
                  {0x5916B183u,0xD4912EA8u,0x01454E44u,0x0000091Du}
              };
              for (i = 0; i < 36; ++i) {
                  for (j = 0; j < 36; ++j) ref[i][j] = (i == j) ? 0u : 0x7FFFu;
              }
              for (i = 0; i < 36; ++i) {
                  for (k = 0; k < 4; ++k) {
                      uint16_t e = get_edge((uint8_t)(i + 1u), (uint8_t)k);
                      if (e) {
                          uint8_t v = (uint8_t)(e & 63u);
                          uint8_t w = (uint8_t)(e >> 6);
                          unsigned back, ok = 0;
                          if (v == 0u || v > 36u || w == 0u) {
                              printf("invalid encoded edge at N%u slot %u\\n", i + 1u, k);
                              return 1;
                          }
                          if (ref[i][v - 1u] != 0x7FFFu && ref[i][v - 1u] != w) {
                              printf("duplicate/conflicting edge N%u-N%u\\n", i + 1u, v);
                              return 1;
                          }
                          ref[i][v - 1u] = w;
                          for (back = 0; back < 4; ++back) {
                              uint16_t r = get_edge(v, (uint8_t)back);
                              if (r && (r & 63u) == i + 1u && (r >> 6) == w) ok = 1;
                          }
                          if (!ok) {
                              printf("asymmetric edge N%u-N%u\\n", i + 1u, v);
                              return 1;
                          }
                          if (i + 1u < v) ++edges;
                      }
                  }
              }
              for (k = 0; k < 36; ++k)
                  for (i = 0; i < 36; ++i)
                      for (j = 0; j < 36; ++j)
                          if ((uint32_t)ref[i][k] + ref[k][j] < ref[i][j])
                              ref[i][j] = (uint16_t)(ref[i][k] + ref[k][j]);
              for (i = 0; i < 36; ++i) {
                  for (j = 0; j < 36; ++j) {
                      uint8_t n = shortest_path((uint8_t)(i + 1u), (uint8_t)(j + 1u), path, dist);
                      uint16_t cost = 0;
                      if (!n || n > 36u || path[0] != i + 1u || path[n - 1u] != j + 1u) {
                          printf("bad endpoints/length for N%u -> N%u\\n", i + 1u, j + 1u);
                          return 1;
                      }
                      for (z = 1; z < n; ++z) {
                          unsigned q;
                          int found = 0;
                          for (q = 0; q < 4; ++q) {
                              uint16_t e = get_edge(path[z - 1u], (uint8_t)q);
                              if (e && (e & 63u) == path[z]) {
                                  cost = (uint16_t)(cost + (e >> 6));
                                  found = 1;
                                  break;
                              }
                          }
                          if (!found) {
                              printf("invalid path edge N%u -> N%u\\n", path[z - 1u], path[z]);
                              return 1;
                          }
                      }
                      if (ref[i][j] == 0x7FFFu || cost != ref[i][j]) {
                          printf("non-shortest path N%u -> N%u: got %u expected %u\\n",
                                 i + 1u, j + 1u, cost, ref[i][j]);
                          return 1;
                      }
                      ++pairs;
                  }
              }
              for (i = 0; i < 6; ++i) {
                  hi = cases[i].ch;
                  lo = cases[i].cl;
                  present_decrypt(&hi, &lo);
                  if (hi != cases[i].ph || lo != cases[i].pl) {
                      printf("PRESENT vector %u failed: %08X%08X\\n", i + 1u, hi, lo);
                      return 1;
                  }
              }
              printf("PASS: %u undirected edges, %u ordered shortest paths, 6/6 PRESENT vectors\\n",
                     edges, pairs);
              return 0;
          }
          EOF
          gcc -std=c11 -O2 -Wall -Wextra -I. /tmp/task3a_audit.c -o /tmp/task3a_audit
          /tmp/task3a_audit
      - name: Install RISC-V compiler and Picolibc
        run: |
          sudo apt-get update
          apt-cache search picolibc
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Build with official generatehex script
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          command -v riscv64-unknown-elf-gcc
          find /usr -name picolibc.specs -o -name picolibc.ld 2>/dev/null | head -20
          bash generatehex.sh
          test -s ../program.hex
          test -s ../program.lss
          wc -c ../program.hex ../program.lss
      - name: Commit generated program.hex to Task 3A code folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Task_3/Task_3A/code/program.hex
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Task 3A RISC-V program.hex"
            git push origin HEAD:task-3a-solution
          fi
      - name: Upload generated Task 3A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task3a-riscv-build
          path: |
            Task_3/Task_3A/code/program.hex
            Task_3/Task_3A/code/program.lss
