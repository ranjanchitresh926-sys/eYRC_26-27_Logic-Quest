name: Task 3A release package
permissions:
  contents: read
on:
  push:
    branches:
      - task-3a-solution
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Run official host tests
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -e
          bash test.sh
      - name: Generate final RISC-V image
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          rm -f ../program.hex ../program.lss
          bash generatehex.sh
          test -s ../program.hex
          test -s ../program.lss
          riscv64-unknown-elf-size -B ../.temp.file.elf || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=Path("../program.hex").read_text().splitlines()
          words=[w for row in rows[1:] for w in row.split()]
          assert rows[0].strip()=="@00000000"
          assert len(rows)==257
          assert len(words)==1024
          assert all(re.fullmatch(r"[0-9A-Fa-f]{8}",w) for w in words)
          print("Verified 1024 RV32I words in program.hex")
          PY
      - name: Create exact Task 3A submission ZIP
        run: |
          set -e
          mkdir -p /tmp/release/lq_1137_task3a
          cp -a Task_3/Task_3A/code /tmp/release/lq_1137_task3a/code
          cd /tmp/release
          zip -qr /tmp/lq_1137_task3a.zip lq_1137_task3a
          zip -T /tmp/lq_1137_task3a.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile("/tmp/lq_1137_task3a.zip")
          names=set(z.namelist())
          required=[
            "lq_1137_task3a/code/program.hex",
            "lq_1137_task3a/code/program.lss",
            "lq_1137_task3a/code/c_programs/Path_Planner_Dec.c",
            "lq_1137_task3a/code/c_programs/c_simulator.sh",
            "lq_1137_task3a/code/c_programs/encrypt.sh",
            "lq_1137_task3a/code/c_programs/test.sh",
            "lq_1137_task3a/code/c_programs/generatehex.sh",
          ]
          missing=[p for p in required if p not in names]
          assert not missing, missing
          print("Verified exact submission ZIP layout")
          print("\n".join(sorted(names)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lq_1137_task3a
          path: /tmp/lq_1137_task3a.zip
