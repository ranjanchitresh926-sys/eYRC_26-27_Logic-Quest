name: Task 3A repair verification
permissions:
  contents: read
on:
  push:
    branches:
      - task-3a-solution
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Host verification
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          bash -n c_simulator.sh encrypt.sh test.sh generatehex.sh
          bash test.sh
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer Path_Planner_Dec.c -o /tmp/planner-san
          for args in "35 7 0" "3 36 0" "14 14 0" "7 E3399C2AAF0E5CA0 1" "26 12 0" "12 21020660468109D7 1" "22 D30E1799F911813A 1" "22 D01C53F5BFD076BA 1"; do
            ASAN_OPTIONS=detect_leaks=1 /tmp/planner-san $args >/dev/null
          done
      - name: Build official RV32I image
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          rm -f ../program.hex ../program.lss
          bash generatehex.sh
          test -s ../program.hex
          test -s ../program.lss
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wall -c Path_Planner_Dec.c -o /tmp/audit.o
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wl,--gc-sections,--defsym=__flash=0x00000000,--defsym=__flash_size=4096 --crt0=minimal -Wl,--defsym=__ram=0x02000000,--defsym=__ram_size=512,--defsym=__stack_size=184 -Tpicolibc.ld -o /tmp/audit.elf /tmp/audit.o
          riscv64-unknown-elf-size -B --common /tmp/audit.elf
          riscv64-unknown-elf-objdump -h /tmp/audit.elf > /tmp/sections.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=Path("../program.hex").read_text().splitlines()
          assert rows[0].strip()=="@00000000"
          assert len(rows)==257
          words=[w for row in rows[1:] for w in row.split()]
          assert len(words)==1024 and all(re.fullmatch(r"[0-9A-Fa-f]{8}",w) for w in words)
          sections=Path("/tmp/sections.txt").read_text()
          for name in (".rodata", ".data", ".sdata"):
              for line in sections.splitlines():
                  if re.search(r"\\s"+re.escape(name)+r"\\s", line):
                      fields=line.split()
                      assert int(fields[2],16)==0, (name,line)
          listing=Path("../program.lss").read_text()
          assert not re.search(r"\\b(static const|graph\\[36\\])", listing)
          print("PASS: 4 KiB image is valid; no initialized data tables in the ELF")
          PY
      - name: Package exact submission
        run: |
          set -euo pipefail
          mkdir -p /tmp/release/lq_1137_task3a
          cp -a Task_3/Task_3A/code /tmp/release/lq_1137_task3a/code
          cd /tmp/release
          zip -qr /tmp/lq_1137_task3a.zip lq_1137_task3a
          zip -T /tmp/lq_1137_task3a.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile("/tmp/lq_1137_task3a.zip")
          names=set(z.namelist())
          required={
            "lq_1137_task3a/code/program.hex",
            "lq_1137_task3a/code/program.lss",
            "lq_1137_task3a/code/c_programs/Path_Planner_Dec.c",
            "lq_1137_task3a/code/c_programs/c_simulator.sh",
            "lq_1137_task3a/code/c_programs/encrypt.sh",
            "lq_1137_task3a/code/c_programs/test.sh",
            "lq_1137_task3a/code/c_programs/generatehex.sh",
          }
          assert required <= names, required-names
          assert len(names)==10, sorted(names)
          print("PASS: exact archive layout")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lq_1137_task3a_repaired
          path: /tmp/lq_1137_task3a.zip
