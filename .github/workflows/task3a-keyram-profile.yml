name: Task 3A key RAM profiles
permissions:
  contents: read
on:
  push:
    branches:
      - task-3a-solution
    paths:
      - ".github/workflows/task3a-keyram-profile.yml"
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Install RV32I toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Compare volatile key-state designs
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path("Path_Planner_Dec.c")
          base=p.read_text()
          a=base.index("static void present_decrypt(")
          b=base.index("static uint16_t select_edge(",a)
          dec=base[a:b]
          rounddef="""static void decrypt_round(uint32_t *hi, uint32_t *lo, volatile uint32_t *kh, volatile uint32_t *km) {
              inv_perm(hi, lo);
              *hi = pisbox_word(*hi) ^ *kh;
              *lo = pisbox_word(*lo) ^ *km;
          }
          """
          present="""static void present_decrypt(uint32_t *hi, uint32_t *lo) {
              volatile uint32_t kh=PRESENT_KEY_HI, km=PRESENT_KEY_MID;
              volatile uint16_t kl=PRESENT_KEY_LO;
              uint8_t r;
              void (* volatile step)(volatile uint32_t *,volatile uint32_t *,volatile uint16_t *,uint8_t)=key_next;
              void (* volatile round)(uint32_t *,uint32_t *,volatile uint32_t *,volatile uint32_t *)=decrypt_round;
              for(r=1;r<=31;r++) step(&kh,&km,&kl,r);
              *hi ^= kh;
              *lo ^= km;
              step=key_prev;
              for(r=31;r>0;r--) {
                  step(&kh,&km,&kl,r);
                  round(hi,lo,&kh,&km);
              }
          }
          """
          variant=base[:a]+rounddef+present+base[b:]
          variant=variant.replace("static void key_next(uint32_t *kh, uint32_t *km, uint16_t *kl, uint8_t r)","static void key_next(volatile uint32_t *kh, volatile uint32_t *km, volatile uint16_t *kl, uint8_t r)")
          variant=variant.replace("static void key_prev(uint32_t *kh, uint32_t *km, uint16_t *kl, uint8_t r)","static void key_prev(volatile uint32_t *kh, volatile uint32_t *km, volatile uint16_t *kl, uint8_t r)")
          # Keep the decrypt, route selector, edge selector and path routine as separate frames.
          variant=variant.replace("        present_decrypt(&block_hi, &block_lo);",
              "        void (* volatile dec_call)(uint32_t *,uint32_t *)=present_decrypt;"+chr(10)+"        dec_call(&block_hi, &block_lo);")
          variant=variant.replace("    uint16_t e = get_edge(cur, route_slot(cur, end));",
              "    uint8_t (* volatile pick)(uint8_t,uint8_t)=route_slot;"+chr(10)+"    uint16_t (* volatile edge)(uint8_t,uint8_t)=get_edge;"+chr(10)+"    uint16_t e = edge(cur, pick(cur, end));")
          variant=variant.replace("idx = plan_path(start_point, end_point, path_planned);",
              "uint8_t (* volatile plan_call)(uint8_t,uint8_t,uint8_t *)=plan_path;"+chr(10)+"    idx = plan_call(start_point, end_point, path_planned);")
          variants={"base":base,"key_mem_round":variant}
          for name,src in variants.items():
              d=Path("/tmp/keyram")/name; d.mkdir(parents=True,exist_ok=True)
              f=d/"Path_Planner_Dec.c"; f.write_text(src)
              host=subprocess.run(["gcc","-std=c11","-O2",str(f),"-o",str(d/"host")],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if host.returncode: raise RuntimeError(host.stderr)
              # Reproduce the eight official argument/output checks.
              cases=[("35","7","0"),("3","36","0"),("14","14","0"),("7","E3399C2AAF0E5CA0","1"),("26","12","0"),("12","21020660468109D7","1"),("22","D30E1799F911813A","1"),("22","D01C53F5BFD076BA","1")]
              for x,y,z in cases:
                  r=subprocess.run([str(d/"host"),x,y,z],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if r.returncode: raise RuntimeError(name+" case failed "+str((x,y,z)))
              obj=d/"a.o"; elf=d/"a.elf"
              subprocess.run(["riscv64-unknown-elf-gcc","-march=rv32i","-mabi=ilp32","--specs=picolibc.specs","-Os","-g3","-flto","-DPICOLIBC_INTEGER_PRINTF_SCANF","-Wall","-c",str(f),"-o",str(obj)],check=True)
              subprocess.run(["riscv64-unknown-elf-gcc","-march=rv32i","-mabi=ilp32","--specs=picolibc.specs","-Os","-g3","-flto","-DPICOLIBC_INTEGER_PRINTF_SCANF","-Wl,--gc-sections,--defsym=__flash=0x00000000,--defsym=__flash_size=4096","--crt0=minimal","-Wl,--defsym=__ram=0x02000000,--defsym=__ram_size=512,--defsym=__stack_size=184","-Tpicolibc.ld","-o",str(elf),str(obj)],check=True)
              size=subprocess.check_output(["riscv64-unknown-elf-size","-B","--common",str(elf)],text=True).splitlines()[-1]
              dis=subprocess.check_output(["riscv64-unknown-elf-objdump","-d","-M","no-aliases,numeric",str(elf)],text=True)
              frames=[]
              for i,line in enumerate(dis.splitlines()):
                  if any(line.endswith("<"+n+">:") for n in ("main","present_decrypt","decrypt_round")):
                      for zline in dis.splitlines()[i+1:i+15]:
                          m=re.search(r"addi\s+x2,x2,(-?\d+)",zline)
                          if m:
                              frames.append((line.strip(),-int(m.group(1)))); break
              print(name,"SIZE",size,"FRAMES",frames)
          PY
