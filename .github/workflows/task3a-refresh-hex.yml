name: Refresh tracked Task 3A image
permissions:
  contents: write
on:
  push:
    branches:
      - task-3a-solution
    paths:
      - ".github/workflows/task3a-refresh-hex.yml"
      - "Task_3/Task_3A/code/c_programs/Path_Planner_Dec.c"
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Build and update HEX
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          bash generatehex.sh
          cd ../../..
          git add -f Task_3/Task_3A/code/program.hex
          git -c user.name="Chitresh Ranjan" -c user.email="243762525+ranjanchitresh926-sys@users.noreply.github.com" commit -m "Refresh Task 3A image for corrected arena graph"
          git push origin task-3a-solution
