name: Task 3A scratch overlay profile
permissions:
  contents: read
on:
  push:
    branches:
      - task-3a-solution
    paths:
      - ".github/workflows/task3a-scratch-overlay-profile.yml"
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Install RV32I toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Build scratch-overlay variant
        working-directory: Task_3/Task_3A/code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("c_programs/Path_Planner_Dec.c").read_text()
          nl=chr(10)
          s=s.replace("static void key_next(uint32_t *kh, uint32_t *km, uint16_t *kl, uint8_t r)","static void key_next(volatile uint32_t *kh, volatile uint32_t *km, volatile uint16_t *kl, uint8_t r)")
          s=s.replace("static void key_prev(uint32_t *kh, uint32_t *km, uint16_t *kl, uint8_t r)","static void key_prev(volatile uint32_t *kh, volatile uint32_t *km, volatile uint16_t *kl, uint8_t r)")
          a=s.index("static void present_decrypt(")
          b=s.index("static uint16_t select_edge(",a)
          new=("static void present_decrypt(uint32_t *hi, uint32_t *lo, uint8_t *scratch) {"+nl+
          "    uintptr_t p=((uintptr_t)scratch+3u)&~(uintptr_t)3u;"+nl+
          "    volatile uint32_t *kh=(volatile uint32_t *)p;"+nl+
          "    volatile uint32_t *km=(volatile uint32_t *)(p+4u);"+nl+
          "    volatile uint16_t *kl=(volatile uint16_t *)(p+8u);"+nl+
          "    uint8_t r;"+nl+
          "    *kh=PRESENT_KEY_HI; *km=PRESENT_KEY_MID; *kl=PRESENT_KEY_LO;"+nl+
          "    for(r=1;r<=31;r++) key_next(kh,km,kl,r);"+nl+
          "    *hi^=*kh; *lo^=*km;"+nl+
          "    for(r=31;r>0;r--) {"+nl+
          "        key_prev(kh,km,kl,r);"+nl+
          "        inv_perm(hi,lo);"+nl+
          "        *hi=pisbox_word(*hi)^*kh;"+nl+
          "        *lo=pisbox_word(*lo)^*km;"+nl+
          "    }"+nl+
          "}"+nl)
          s=s[:a]+new+s[b:]
          # Keep next-edge selection in a separate, small helper.
          a=s.index("static uint8_t plan_path(")
          b=s.index(nl+"// ##############################################",a)
          route=("static uint8_t next_node(uint8_t cur, uint8_t dst) {"+nl+
                 "    uint16_t e=get_edge(cur,route_slot(cur,dst));"+nl+
                 "    return e?(uint8_t)(e&63u):0;"+nl+
                 "}"+nl+
                 "static uint8_t plan_path(uint8_t start, uint8_t end, uint8_t path[40]) {"+nl+
                 "    uint8_t len=1;"+nl+
                 "    uint8_t (* volatile next)(uint8_t,uint8_t)=next_node;"+nl+
                 "    if(start<1u||start>36u||end<1u||end>36u) return 0;"+nl+
                 "    path[0]=start;"+nl+
                 "    while(path[len-1u]!=end&&len<36u) {"+nl+
                 "        uint8_t v=next(path[len-1u],end);"+nl+
                 "        if(!v) return 0;"+nl+
                 "        path[len++]=v;"+nl+
                 "    }"+nl+
                 "    return path[len-1u]==end?len:0;"+nl+
                 "}"+nl)
          s=s[:a]+route+s[b:]
          s=s.replace("        present_decrypt(&block_hi, &block_lo);",
              "        void (* volatile dec)(uint32_t *,uint32_t *,uint8_t *)=present_decrypt;"+nl+
              "        dec(&block_hi,&block_lo,&path_planned[20]);")
          s=s.replace("    idx = plan_path(start_point, end_point, path_planned);",
              "    uint8_t (* volatile plan)(uint8_t,uint8_t,uint8_t *)=plan_path;"+nl+
              "    idx=plan(start_point,end_point,path_planned);")
          Path("/tmp/Path_Planner_Dec_overlay.c").write_text(s)
          print("Generated scratch-overlay profile source")
          PY
          gcc -std=c11 -O2 -Wall -Wextra /tmp/Path_Planner_Dec_overlay.c -o /tmp/overlay-host
          cd c_programs
          for args in "35 7 0" "3 36 0" "14 14 0" "7 E3399C2AAF0E5CA0 1" "26 12 0" "12 21020660468109D7 1" "22 D30E1799F911813A 1" "22 D01C53F5BFD076BA 1"; do /tmp/overlay-host $args >/dev/null; done
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wall -c /tmp/Path_Planner_Dec_overlay.c -o /tmp/overlay.o
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wl,--gc-sections,--defsym=__flash=0x00000000,--defsym=__flash_size=4096 --crt0=minimal -Wl,--defsym=__ram=0x02000000,--defsym=__ram_size=512,--defsym=__stack_size=184 -Tpicolibc.ld -o /tmp/overlay.elf /tmp/overlay.o
          riscv64-unknown-elf-size -B --common /tmp/overlay.elf
          riscv64-unknown-elf-objdump -d -M no-aliases,numeric /tmp/overlay.elf > /tmp/overlay.dis
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("/tmp/overlay.dis").read_text().splitlines()
          for i,line in enumerate(lines):
              m=re.search(r"<([^>]+)>:",line)
              if m and m.group(1) in ("main","present_decrypt","plan_path","next_node"):
                  frame=0
                  for x in lines[i+1:i+30]:
                      z=re.search(r"addi\s+x2,x2,(-?\d+)",x)
                      if z:
                          v=int(z.group(1)); frame=-v if v<0 else 0; break
                  print(m.group(1), "frame", frame)
          PY
