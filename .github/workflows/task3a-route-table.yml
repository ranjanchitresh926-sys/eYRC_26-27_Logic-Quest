name: Task 3A stateless routing experiment
permissions:
  contents: write
on:
  push:
    branches:
      - task-3a-solution
    paths:
      - ".github/workflows/task3a-route-table.yml"
jobs:
  route:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-3a-solution
      - name: Generate and audit route code
        working-directory: Task_3/Task_3A/code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("c_programs/Path_Planner_Dec.c")
          src=p.read_text()
          nl=chr(10)
          rows="""1:36/100 5/5 4/15 6/15
          2:4/5
          3:6/5
          4:2/5 1/15 14/15
          5:1/5 7/11 8/11
          6:3/5 1/15
          7:5/11 10/5 15/11
          8:5/11 11/5 20/11
          9:11/7 12/5
          10:7/5
          11:8/5 9/7 19/7
          12:9/5
          13:14/5 30/19
          14:13/5 15/5 4/15
          15:14/5 7/11
          16:17/5 23/7
          17:16/5
          18:19/5
          19:18/5 11/7
          20:21/5 8/11 27/11
          21:20/5
          22:25/5
          23:16/7 25/7 26/5
          24:27/5
          25:22/5 23/7
          26:23/5 29/11
          27:24/5 20/11 29/11
          28:31/5 32/15
          29:26/11 27/11 32/5
          30:33/5 13/19 35/19
          31:28/5 34/5 35/19
          32:29/5 28/15
          33:30/5
          34:31/5
          35:30/19 31/19
          36:1/100"""
          adj=[[] for _ in range(37)]
          for line in rows.splitlines():
              if line.strip():
                  a,b=line.strip().split(":"); u=int(a)
                  for z in b.split():
                      v,w=map(int,z.split("/")); adj[u].append((v,w))
          assert sum(map(len,adj))==74
          for u in range(1,37):
              for v,w in adj[u]:
                  assert any(x==u and c==w for x,c in adj[v]),(u,v,w)
          def shortest(s,t):
              d=[65535]*37; seen=[False]*37; d[s]=0
              for _ in range(36):
                  best=65535; u=0
                  for j in range(1,37):
                      if not seen[j] and d[j]<best:
                          best=d[j]; u=j
                  if not u: break
                  seen[u]=True
                  if u==t: break
                  for v,w in adj[u]:
                      if not seen[v] and best+w<d[v]:
                          d[v]=best+w
              cur=t; rev=[cur]
              while cur!=s and len(rev)<40:
                  for v,w in adj[cur]:
                      if d[v]+w==d[cur]:
                          cur=v; rev.append(cur); break
                  else: raise RuntimeError((s,t,cur,d[cur]))
              return list(reversed(rev)),d[t]
          slots=[[0]*37 for _ in range(37)]
          for s in range(1,37):
              for t in range(1,37):
                  route,_=shortest(s,t)
                  if len(route)>1: slots[s][t]=[v for v,w in adj[s]].index(route[1])
          words=[]
          for s in range(1,37):
              row=[]
              for wi in range(3):
                  x=0
                  for j in range(16):
                      d=wi*16+j+1
                      if d<=36: x|=(slots[s][d]&3)<<(2*j)
                  row.append(x)
              words.append(row)
          def emit(lo,hi,level=2):
              pad="    "*level
              if lo==hi:
                  a,b,c=words[lo-1]
                  return f"{pad}a = 0x{a:08X}u;{nl}{pad}b = 0x{b:08X}u;{nl}{pad}c = 0x{c:08X}u;{nl}"
              mid=(lo+hi)//2
              return f"{pad}if (src <= {mid}u) {{{nl}"+emit(lo,mid,level+1)+f"{pad}}} else {{{nl}"+emit(mid+1,hi,level+1)+f"{pad}}}{nl}"
          code=("static uint8_t route_slot(uint8_t src, uint8_t dst) {"+nl+
                "    uint32_t a, b, c, row;"+nl+
                "    uint8_t i = (uint8_t)(dst - 1u);"+nl+
                emit(1,36)+
                "    if (i < 16u) row = a;"+nl+
                "    else if (i < 32u) row = b;"+nl+
                "    else row = c;"+nl+
                "    return (uint8_t)((row >> ((i & 15u) << 1)) & 3u);"+nl+
                "}"+nl+
                "static uint8_t plan_path(uint8_t start, uint8_t end, uint8_t path[40]) {"+nl+
                "    uint8_t cur = start, len = 1;"+nl+
                "    if (start < 1u || start > 36u || end < 1u || end > 36u) return 0;"+nl+
                "    path[0] = start;"+nl+
                "    while (cur != end && len < 36u) {"+nl+
                "        uint16_t e = get_edge(cur, route_slot(cur, end));"+nl+
                "        if (!e) return 0;"+nl+
                "        cur = (uint8_t)(e & 63u);"+nl+
                "        path[len++] = cur;"+nl+
                "    }"+nl+
                "    return cur == end ? len : 0;"+nl+
                "}"+nl)
          guard="    if (n == 20u) return select_edge(k, 0x0155u, 0x02C8u, 0x02DBu, 0x0000u);"+nl
          old="static uint16_t get_edge(uint8_t n, uint8_t k) {"+nl+"    if (n == 0u || n > 36u) return 0;"+nl
          if guard not in src:
              assert old in src
              src=src.replace(old,old+guard,1)
          start=src.index("static uint8_t shortest_path(")
          end=src.index(nl+"// ##############################################",start)
          src=src[:start]+code+src[end:]
          dist=("#ifdef __linux__"+nl+"    uint8_t dist[36];"+nl+"#else"+nl+
                "    uint8_t *dist = (uint8_t *)0x02000020u;"+nl+"#endif"+nl+nl)
          assert dist in src, "dist declaration not located"
          src=src.replace(dist,"",1)
          oldcall="idx = shortest_path(start_point, end_point, path_planned, dist);"
          assert oldcall in src, "old path call not found"
          src=src.replace(oldcall,"idx = plan_path(start_point, end_point, path_planned);",1)
          p.write_text(src)
          for s in range(1,37):
              for t in range(1,37):
                  cur=s; route=[cur]
                  for _ in range(36):
                      if cur==t: break
                      k=slots[cur][t]
                      cur=adj[cur][k][0]; route.append(cur)
                  expected,cost=shortest(s,t)
                  actual=sum(next(w for v,w in adj[route[i-1]] if v==route[i]) for i in range(1,len(route)))
                  assert route[-1]==t and route==expected and actual==cost,(s,t,route,expected)
          print("PASS: generated next-edge table for all 1,296 shortest routes")
          PY

      - name: Host and sanitizer tests
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          bash -n c_simulator.sh encrypt.sh test.sh generatehex.sh
          bash test.sh
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer Path_Planner_Dec.c -o /tmp/plan-san
          for args in "35 7 0" "3 36 0" "14 14 0" "7 E3399C2AAF0E5CA0 1" "26 12 0" "12 21020660468109D7 1" "22 D30E1799F911813A 1" "22 D01C53F5BFD076BA 1"; do
            ASAN_OPTIONS=detect_leaks=1 /tmp/plan-san $args >/dev/null
          done
      - name: PRESENT-80 and encrypted-route stress
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          cat > /tmp/stress.c <<'EOF'
          #define main lq_original_main
          #include "Path_Planner_Dec.c"
          #undef main
          #include <stdio.h>
          #include <stdint.h>
          static const uint8_t sb[16]={0xC,0x5,0x6,0xB,0x9,0x0,0xA,0xD,0x3,0xE,0xF,0x8,0x4,0x7,0x1,0x2};
          static uint64_t enc(uint64_t state) {
              uint64_t kh=0xA1B2C3D4E5F60718ULL;
              uint16_t kl=0x293A;
              for(int r=1;r<=31;r++) {
                  state^=kh;
                  uint64_t sub=0;
                  for(int n=0;n<16;n++) sub|=(uint64_t)sb[(state>>(4*n))&15u]<<(4*n);
                  uint64_t perm=0;
                  for(int i=0;i<64;i++) if((sub>>i)&1u) perm|=1ULL<<(i==63?63:(16*i)%63);
                  state=perm;
                  uint64_t old=kh;
                  kh=(old>>19)|((uint64_t)kl<<45)|(old<<61);
                  kl=(uint16_t)(old>>3);
                  kh=(kh&0x0FFFFFFFFFFFFFFFULL)|((uint64_t)sb[kh>>60]<<60);
                  kh^=(uint64_t)(r>>1);
                  kl^=(uint16_t)((r&1)<<15);
              }
              return state^kh;
          }
          static uint64_t rng=0x6A09E667F3BCC909ULL;
          static uint64_t rnd(void) {
              rng^=rng>>12; rng^=rng<<25; rng^=rng>>27;
              return rng*0x2545F4914F6CDD1DULL;
          }
          static int path_ok(uint8_t s,uint8_t t,uint8_t *p,uint8_t n,const uint16_t d[37][37]) {
              if(!n||p[0]!=s||p[n-1]!=t) return 1;
              uint16_t cost=0;
              for(uint8_t i=1;i<n;i++) {
                  uint8_t found=0;
                  for(uint8_t k=0;k<4;k++) {
                      uint16_t e=get_edge(p[i-1],k);
                      if(e&&(e&63u)==p[i]) {cost+=(uint8_t)(e>>6);found=1;break;}
                  }
                  if(!found) return 2;
              }
              return cost==d[s][t]?0:3;
          }
          int main(void) {
              uint32_t tests=0;
              for(uint32_t i=0;i<100000;i++) {
                  uint64_t plain=rnd(), cipher=enc(plain);
                  uint32_t hi=(uint32_t)(cipher>>32),lo=(uint32_t)cipher;
                  present_decrypt(&hi,&lo);
                  if((((uint64_t)hi<<32)|lo)!=plain) return 1;
                  tests++;
              }
              uint16_t d[37][37];
              for(uint8_t i=1;i<=36;i++) for(uint8_t j=1;j<=36;j++) d[i][j]=(i==j)?0:65535u;
              for(uint8_t i=1;i<=36;i++) for(uint8_t k=0;k<4;k++) {
                  uint16_t e=get_edge(i,k); if(e) d[i][e&63u]=(uint8_t)(e>>6);
              }
              for(uint8_t k=1;k<=36;k++) for(uint8_t i=1;i<=36;i++) for(uint8_t j=1;j<=36;j++)
                  if((uint32_t)d[i][k]+d[k][j]<d[i][j]) d[i][j]=(uint16_t)(d[i][k]+d[k][j]);
              for(uint8_t s=1;s<=36;s++) for(uint8_t t=1;t<=36;t++) for(uint8_t done=0;done<=1;done++) {
                  uint8_t next=done?0:(uint8_t)(((s+t-2)%36)+1);
                  uint64_t plain=((uint64_t)done<<56)|((uint64_t)'A'<<48)|((uint64_t)'B'<<40)|((uint64_t)'C'<<32)|((uint64_t)'D'<<24)|((uint64_t)'E'<<16)|((uint64_t)next<<8)|t;
                  uint64_t cipher=enc(plain);
                  uint32_t hi=(uint32_t)(cipher>>32),lo=(uint32_t)cipher;
                  present_decrypt(&hi,&lo);
                  if((((uint64_t)hi<<32)|lo)!=plain) return 2;
                  uint8_t p[40],n=plan_path(s,t,p);
                  if(path_ok(s,t,p,n,d)) return 3;
                  tests++;
              }
              printf("PASS: %u random-cipher and encrypted-route cases",tests); putchar(10);
              return 0;
          }
          EOF
          gcc -std=c11 -O2 -fsanitize=address,undefined -fno-omit-frame-pointer -I. /tmp/stress.c -o /tmp/stress
          ASAN_OPTIONS=detect_leaks=1 /tmp/stress
      - name: All-pairs C audit
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          cat > /tmp/route_audit.c <<'EOF'
          #define main old_main
          #include "Path_Planner_Dec.c"
          #undef main
          #include <stdio.h>
          int main(void) {
              uint16_t d[37][37];
              for(uint8_t i=1;i<=36;i++) for(uint8_t j=1;j<=36;j++) d[i][j]=(i==j)?0:65535u;
              for(uint8_t i=1;i<=36;i++) for(uint8_t k=0;k<4;k++) {
                  uint16_t e=get_edge(i,k); if(e) d[i][e&63u]=(uint16_t)(e>>6);
              }
              for(uint8_t k=1;k<=36;k++) for(uint8_t i=1;i<=36;i++) for(uint8_t j=1;j<=36;j++)
                  if((uint32_t)d[i][k]+d[k][j]<d[i][j]) d[i][j]=(uint16_t)(d[i][k]+d[k][j]);
              uint8_t path[40]; uint32_t pairs=0;
              for(uint8_t s=1;s<=36;s++) for(uint8_t t=1;t<=36;t++) {
                  uint8_t n=plan_path(s,t,path); if(!n||path[0]!=s||path[n-1]!=t) return 1;
                  uint16_t cost=0;
                  for(uint8_t i=1;i<n;i++) {
                      uint8_t ok=0;
                      for(uint8_t k=0;k<4;k++) {
                          uint16_t e=get_edge(path[i-1],k);
                          if(e&&(e&63u)==path[i]) {cost+=(uint8_t)(e>>6);ok=1;break;}
                      }
                      if(!ok) return 2;
                  }
                  if(cost!=d[s][t]) return 3;
                  pairs++;
              }
              printf("PASS %u all-pairs routes",pairs); putchar(10);
              return 0;
          }
          EOF
          gcc -std=c11 -O2 -fsanitize=address,undefined -I. /tmp/route_audit.c -o /tmp/route_audit
          /tmp/route_audit
      - name: Official RV32I build
        working-directory: Task_3/Task_3A/code/c_programs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          rm -f ../program.hex ../program.lss
          bash generatehex.sh
          test -s ../program.hex
          test -s ../program.lss
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wall -c Path_Planner_Dec.c -o /tmp/audit.o
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 --specs=picolibc.specs -Os -g3 -flto -DPICOLIBC_INTEGER_PRINTF_SCANF -Wl,--gc-sections,--defsym=__flash=0x00000000,--defsym=__flash_size=4096 --crt0=minimal -Wl,--defsym=__ram=0x02000000,--defsym=__ram_size=512,--defsym=__stack_size=184 -Tpicolibc.ld -o /tmp/audit.elf /tmp/audit.o
          riscv64-unknown-elf-size -B --common /tmp/audit.elf
          riscv64-unknown-elf-objdump -h /tmp/audit.elf > /tmp/sections.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=Path("../program.hex").read_text().splitlines()
          assert rows[0].strip()=="@00000000" and len(rows)==257
          words=[w for line in rows[1:] for w in line.split()]
          assert len(words)==1024 and all(re.fullmatch(r"[0-9A-Fa-f]{8}",w) for w in words)
          sections=Path("/tmp/sections.txt").read_text()
          for name in (".rodata",".data",".sdata"):
              for line in sections.splitlines():
                  f=line.split()
                  if len(f)>2 and f[1]==name: assert int(f[2],16)==0,(name,line)
          listing=Path("../program.lss").read_text()
          assert not re.search(r"\\b(mul|mulh|div|divu|rem|remu)\\b",listing)
          print("PASS: RV32I image valid; no initialized data table")
          PY
      - name: Package candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/release/lq_1137_task3a
          cp -a Task_3/Task_3A/code /tmp/release/lq_1137_task3a/code
          cd /tmp/release
          zip -qr /tmp/lq_1137_task3a_route.zip lq_1137_task3a
          zip -T /tmp/lq_1137_task3a_route.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile("/tmp/lq_1137_task3a_route.zip")
          names=set(z.namelist())
          assert len(names)==10
          assert "lq_1137_task3a/code/program.hex" in names
          assert "lq_1137_task3a/code/program.lss" in names
          print("PASS: exact submission ZIP")
          PY
          cd "$GITHUB_WORKSPACE"
          git config user.name "Task 3A build"
          git config user.email "243762525+ranjanchitresh926-sys@users.noreply.github.com"
          git add -f Task_3/Task_3A/code/c_programs/Path_Planner_Dec.c Task_3/Task_3A/code/program.hex
          git commit -m "Apply RAM-efficient Task 3A route planner"
          git push origin task-3a-solution
      - uses: actions/upload-artifact@v4
        with:
          name: task3a_route_table_candidate
          path: /tmp/lq_1137_task3a_route.zip
